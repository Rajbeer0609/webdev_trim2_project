<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost & Found Quiz Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f0f0;
            --card-bg: #ffffff;
            --primary: #8b5cf6; /* Electric Purple */
            --accent: #ffeb3b;  /* Cyber Yellow */
            --danger: #ff4757;  /* Hot Red */
            --success: #2ed573; /* Neon Green */
            --border: 3px solid #000000;
            --shadow: 5px 5px 0px #000000;
            --shadow-hover: 2px 2px 0px #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #e5e5f7;
            /* Crazy CSS Grid Pattern Background */
            background-image:  linear-gradient(#000000 1.2px, transparent 1.2px), linear-gradient(90deg, #000000 1.2px, transparent 1.2px);
            background-size: 30px 30px;
            background-position: center center;
            min-height: 100vh;
            padding: 40px 20px;
            color: #000;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border: var(--border);
            box-shadow: 10px 10px 0px #000;
            position: relative;
        }

        /* --- Header Section --- */
        .header {
            background: var(--accent);
            padding: 40px;
            text-align: center;
            border-bottom: var(--border);
        }

        .header h1 {
            font-size: 3rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: -2px;
            text-shadow: 3px 3px 0px #fff;
            margin-bottom: 10px;
        }

        /* --- Navigation Tabs --- */
        .nav-tabs {
            display: flex;
            background: #000;
            padding: 0;
            gap: 0;
        }

        .nav-tab {
            flex: 1;
            padding: 20px;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            border: none;
            background: #fff;
            color: #000;
            border-right: var(--border);
            border-bottom: var(--border);
            transition: all 0.2s;
        }

        .nav-tab:last-child { border-right: none; }

        .nav-tab:hover {
            background: #f0f0f0;
        }

        .nav-tab.active {
            background: var(--primary);
            color: #fff;
            box-shadow: inset 0 0 0 5px rgba(0,0,0,0.1);
        }

        /* --- Content Layout --- */
        .content { padding: 40px; }
        .view { display: none; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Forms & Inputs --- */
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            background: #000;
            color: #fff;
            display: inline-block;
            padding: 2px 8px;
            transform: rotate(-1deg);
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 15px;
            border: var(--border);
            border-radius: 0;
            background: #fff;
            font-family: inherit;
            font-size: 1rem;
            transition: 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            background: #fffbf0;
            box-shadow: 4px 4px 0px var(--primary);
        }

        /* --- Buttons --- */
        .btn {
            padding: 15px 30px;
            border: var(--border);
            border-radius: 0;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.1s;
            font-family: inherit;
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: var(--shadow-hover);
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: black; }
        .btn-small { padding: 8px 16px; font-size: 0.9rem; box-shadow: 3px 3px 0px #000; }

        /* --- Quiz Cards --- */
        .question-card {
            background: #fff;
            border: var(--border);
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            position: relative;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px dashed #000;
            padding-bottom: 15px;
        }

        .category-badge {
            background: #000;
            color: #fff;
            padding: 5px 15px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            transform: rotate(2deg);
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* --- Options --- */
        .options { gap: 15px; }
        
        .option {
            background: #fff;
            border: 2px solid #000;
            padding: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: 0.2s;
        }

        .option:hover {
            background: #f0f0f0;
            transform: translateX(5px);
            box-shadow: 3px 3px 0px #000;
        }

        .option.selected {
            background: var(--accent);
            box-shadow: 5px 5px 0px #000;
            transform: translateX(-5px);
            font-weight: bold;
        }

        .option.correct {
            background: var(--success);
            border-color: #000;
        }

        .option.incorrect {
            background: var(--danger);
            color: #fff;
            border-color: #000;
        }

        .option-label {
            width: 35px;
            height: 35px;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            border: 2px solid #000;
        }
        
        .option.selected .option-label { background: #fff; color: #000; }

        /* --- Admin & History Styles --- */
        .admin-item {
            background: #fff;
            border: var(--border);
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 4px 4px 0px #ccc;
        }

        .history-table { width: 100%; border-collapse: separate; border-spacing: 0; border: var(--border); }
        .history-table th { background: #000; color: #fff; padding: 15px; text-align: left; text-transform: uppercase; }
        .history-table td { padding: 15px; border-bottom: 1px solid #000; font-weight: 600; }
        .history-table tr:last-child td { border-bottom: none; }

        .score-badge {
            padding: 5px 10px;
            border: 2px solid #000;
            font-weight: 700;
        }
        .score-excellent { background: var(--success); }
        .score-good { background: var(--accent); }
        .score-fair { background: #ffa502; }
        .score-poor { background: var(--danger); color: #fff; }

        /* --- Alerts & States --- */
        .alert {
            padding: 15px;
            border: var(--border);
            margin-bottom: 20px;
            background: var(--success);
            font-weight: bold;
            box-shadow: var(--shadow);
            animation: slideIn 0.3s;
        }

        .results-card {
            background: #000;
            color: var(--success);
            border: 4px solid var(--success);
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 8px 8px 0px var(--success);
        }
        
        .results-card h2 { color: #fff; margin-bottom: 15px; }

        .empty-state {
            text-align: center;
            padding: 60px;
            border: 2px dashed #000;
            background: #f9f9f9;
            color: #777;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .content { padding: 20px; }
            .btn { width: 100%; margin-bottom: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Campus Quiz</h1>
            <p>Lost & Found • DOM Mastery</p>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchView('quiz')">Take Quiz</button>
            <button class="nav-tab" onclick="switchView('admin')">Admin</button>
            <button class="nav-tab" onclick="switchView('history')">History</button>
        </div>

        <div class="content">
            <div id="quiz-view" class="view active">
                <div id="quiz-start">
                    <h2 style="margin-bottom: 20px; font-weight: 900; font-size: 2rem;">Ready?</h2>
                    <p style="margin-bottom: 30px;">Test your understanding of DOM concepts.</p>
                    <div style="background: #fff; border: 2px solid #000; padding: 20px; margin-bottom: 30px; box-shadow: 4px 4px 0px #ddd;">
                        <p><strong>Total Questions:</strong> <span id="total-questions">0</span></p>
                    </div>
                    <button class="btn btn-primary" onclick="startQuiz()">Start Quiz</button>
                </div>
                <div id="quiz-active" style="display: none;">
                    <div id="quiz-results"></div>
                    <div id="questions-container"></div>
                    <button id="submit-btn" class="btn btn-success" onclick="submitQuiz()" style="display: none; width: 100%; margin-top: 20px;">Submit Answers</button>
                </div>
            </div>

            <div id="admin-view" class="view">
                <h2 style="margin-bottom: 20px;">Admin Panel</h2>
                <div id="admin-alert"></div>
                <div style="background: #fff; border: 3px solid #000; padding: 25px; margin-bottom: 40px; box-shadow: 8px 8px 0px #eee;">
                    <h3 style="margin-bottom: 20px; text-decoration: underline; text-decoration-thickness: 3px;">+ Add Question</h3>
                    <form id="add-form" onsubmit="addQuestion(event)">
                        <div class="form-group">
                            <label>Category</label>
                            <input type="text" id="category" placeholder="e.g. HTML" required>
                        </div>
                        <div class="form-group">
                            <label>Question</label>
                            <textarea id="question" rows="2" placeholder="What is..." required></textarea>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div class="form-group">
                                <label>Option A</label>
                                <input type="text" id="opt0" required>
                            </div>
                            <div class="form-group">
                                <label>Option B</label>
                                <input type="text" id="opt1" required>
                            </div>
                            <div class="form-group">
                                <label>Option C</label>
                                <input type="text" id="opt2" required>
                            </div>
                            <div class="form-group">
                                <label>Option D</label>
                                <input type="text" id="opt3" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Correct Answer</label>
                            <select id="correct" required>
                                <option value="">Select Correct Option...</option>
                                <option value="0">Option A</option>
                                <option value="1">Option B</option>
                                <option value="2">Option C</option>
                                <option value="3">Option D</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Explanation</label>
                            <textarea id="explanation" rows="2" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Add Question</button>
                    </form>
                </div>
                <h3>Question Bank (<span id="q-count">0</span>)</h3>
                <div id="admin-list" style="margin-top: 20px;"></div>
            </div>

            <div id="history-view" class="view">
                <h2 style="margin-bottom: 20px;">Your Stats</h2>
                <div id="history-container"></div>
            </div>
        </div>
    </div>

    <script>
        // ... (Keep your original Script exactly as it is) ...
        let questions = [];
        let history = [];
        let answers = {};
        let submitted = false;

        function init() {
            const stored = localStorage.getItem('questions');
            questions = stored ? JSON.parse(stored) : [{id:1,category:"DOM",question:"What method creates DOM elements?",options:["innerHTML","createElement","write","eval"],correct:1,explanation:"createElement is the safe and standard way to generate new nodes programmatically."}];
            
            const hist = localStorage.getItem('history');
            history = hist ? JSON.parse(hist) : [];
            
            save();
            updateStats();
            updateAdmin();
            updateHistory();
        }

        function save() {
            localStorage.setItem('questions', JSON.stringify(questions));
            localStorage.setItem('history', JSON.stringify(history));
        }

        function switchView(view) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[onclick*="${view}"]`).classList.add('active');
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(view + '-view').classList.add('active');
        }

        function updateStats() {
            document.getElementById('total-questions').textContent = questions.length;
        }

        function addQuestion(e) {
            e.preventDefault();
            const q = {
                id: Date.now(),
                category: document.getElementById('category').value,
                question: document.getElementById('question').value,
                options: [
                    document.getElementById('opt0').value,
                    document.getElementById('opt1').value,
                    document.getElementById('opt2').value,
                    document.getElementById('opt3').value
                ],
                correct: parseInt(document.getElementById('correct').value),
                explanation: document.getElementById('explanation').value
            };
            questions.push(q);
            save();
            updateAdmin();
            updateStats();
            showAlert('Question added!');
            document.getElementById('add-form').reset();
        }

        function deleteQuestion(id) {
            if (confirm('Delete this question?')) {
                questions = questions.filter(q => q.id !== id);
                save();
                updateAdmin();
                updateStats();
                showAlert('Question deleted!');
            }
        }

        function updateAdmin() {
            const list = document.getElementById('admin-list');
            document.getElementById('q-count').textContent = questions.length;
            
            if (questions.length === 0) {
                list.innerHTML = '<div class="empty-state">No questions yet</div>';
                return;
            }
            
            list.innerHTML = '';
            questions.forEach(q => {
                const div = document.createElement('div');
                div.className = 'admin-item';
                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        <div style="flex: 1;">
                            <span class="category-badge">${q.category}</span>
                            <p style="margin: 15px 0; font-weight: 600; font-size: 1.1em;">${q.question}</p>
                            <p style="font-size: 14px; color: #555;">Correct Answer: <strong>${q.options[q.correct]}</strong></p>
                        </div>
                        <button class="btn btn-danger btn-small" onclick="deleteQuestion(${q.id})">Delete</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function showAlert(msg) {
            const alert = document.getElementById('admin-alert');
            alert.className = 'alert alert-success';
            alert.textContent = msg;
            alert.style.display = 'block';
            setTimeout(() => alert.style.display = 'none', 3000);
        }

        function startQuiz() {
            if (questions.length === 0) {
                alert('No questions available!');
                return;
            }
            answers = {};
            submitted = false;
            document.getElementById('quiz-start').style.display = 'none';
            document.getElementById('quiz-active').style.display = 'block';
            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            
            questions.forEach((q, i) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.dataset.qid = q.id;
                
                const header = document.createElement('div');
                header.className = 'question-header';
                header.innerHTML = `
                    <span style="font-weight: 900; font-size: 1.2rem;">#${i + 1}</span>
                    <span class="category-badge">${q.category}</span>
                `;
                
                const text = document.createElement('div');
                text.className = 'question-text';
                text.textContent = q.question;
                
                const opts = document.createElement('div');
                opts.className = 'options';
                
                q.options.forEach((opt, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option';
                    optDiv.onclick = () => selectOption(q.id, idx);
                    optDiv.dataset.qid = q.id;
                    optDiv.dataset.idx = idx;
                    
                    const label = document.createElement('div');
                    label.className = 'option-label';
                    label.textContent = String.fromCharCode(65 + idx);
                    
                    const span = document.createElement('span');
                    span.textContent = opt;
                    
                    optDiv.appendChild(label);
                    optDiv.appendChild(span);
                    opts.appendChild(optDiv);
                });
                
                card.appendChild(header);
                card.appendChild(text);
                card.appendChild(opts);
                container.appendChild(card);
            });
            
            document.getElementById('submit-btn').style.display = 'block';
        }

        function selectOption(qid, idx) {
            if (submitted) return;
            const opts = document.querySelectorAll(`.option[data-qid="${qid}"]`);
            opts.forEach(o => o.classList.remove('selected'));
            document.querySelector(`.option[data-qid="${qid}"][data-idx="${idx}"]`).classList.add('selected');
            answers[qid] = idx;
        }

        function submitQuiz() {
            if (Object.keys(answers).length !== questions.length) {
                alert('Please answer all questions!');
                return;
            }
            
            submitted = true;
            let correct = 0;
            
            questions.forEach(q => {
                const userAns = answers[q.id];
                const isCorrect = userAns === q.correct;
                if (isCorrect) correct++;
                
                const opts = document.querySelectorAll(`.option[data-qid="${q.id}"]`);
                opts.forEach((o, idx) => {
                    o.style.cursor = 'default';
                    o.onclick = null; // Disable clicking
                    if (idx === q.correct) o.classList.add('correct');
                    else if (idx === userAns && !isCorrect) o.classList.add('incorrect');
                });
                
                const card = document.querySelector(`.question-card[data-qid="${q.id}"]`);
                const exp = document.createElement('div');
                exp.style.cssText = 'margin-top: 20px; padding: 15px; background: #000; color: #fff; border: 2px solid #000; box-shadow: 4px 4px 0px #888;';
                exp.innerHTML = `<strong style="color: #ffeb3b;">💡 KNOWLEDGE:</strong><br>${q.explanation}`;
                card.appendChild(exp);
            });
            
            const pct = Math.round((correct / questions.length) * 100);
            const results = document.getElementById('quiz-results');
            results.innerHTML = `
                <div class="results-card">
                    <h2 style="font-size: 2.5rem; text-transform: uppercase;">Quiz Done!</h2>
                    <p style="font-size: 1.5rem; font-weight: bold; margin-bottom: 20px;">Score: ${correct}/${questions.length} (${pct}%)</p>
                    <button class="btn" style="background: white; color: black; border: 3px solid black;" onclick="resetQuiz()">Try Again</button>
                </div>
            `;
            
            document.getElementById('submit-btn').style.display = 'none';
            
            history.unshift({
                id: Date.now(),
                date: new Date().toLocaleDateString(),
                total: questions.length,
                correct: correct,
                pct: pct
            });
            save();
            updateHistory();
            window.scrollTo(0,0);
        }

        function resetQuiz() {
            document.getElementById('quiz-start').style.display = 'block';
            document.getElementById('quiz-active').style.display = 'none';
            document.getElementById('quiz-results').innerHTML = '';
            document.getElementById('questions-container').innerHTML = '';
        }

        function updateHistory() {
            const container = document.getElementById('history-container');
            
            if (history.length === 0) {
                container.innerHTML = '<div class="empty-state">No history recorded</div>';
                return;
            }
            
            const table = document.createElement('table');
            table.className = 'history-table';
            table.innerHTML = `<thead><tr><th>Date</th><th>Score</th><th>%</th></tr></thead><tbody></tbody>`;
            
            const tbody = table.querySelector('tbody');
            history.forEach(h => {
                const row = document.createElement('tr');
                let cls = 'score-poor';
                if (h.pct >= 80) cls = 'score-excellent';
                else if (h.pct >= 60) cls = 'score-good';
                else if (h.pct >= 40) cls = 'score-fair';
                
                row.innerHTML = `
                    <td>${h.date}</td>
                    <td>${h.correct} / ${h.total}</td>
                    <td><span class="score-badge ${cls}">${h.pct}%</span></td>
                `;
                tbody.appendChild(row);
            });
            
            container.innerHTML = '';
            container.appendChild(table);
        }

        init();
    </script>
</body>
</html>
